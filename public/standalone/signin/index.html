<!doctype html>
<html lang="uk">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Авторизація | Курсовий проєкт</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <header>Курсовий проєкт</header>
    <main>
      <form action="../book-list/">

        <input id="username" type="text" placeholder="Введіть ім’я" autocomplete="username" minlength="4" maxlength="16" required>
        <button type="submit">Увійти</button>
      </form>
    </main>
  </body>
</html>
